services:
  postgres:
    # Application database.
    image: pgvector/pgvector:pg17
    container_name: ais-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ais
      POSTGRES_DB: ais_dev
    ports:
      - '5432:5432'
    volumes:
      - ais-pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ais -d ais_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  metadata-postgres:
    # Metadata migrations share the schema bundle and require the vector extension.
    image: pgvector/pgvector:pg17
    container_name: ais-metadata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ais
      POSTGRES_DB: ais_metadata
    ports:
      - '5433:5432'
    volumes:
      - ais-metadata-pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ais -d ais_metadata']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ais-pgdata:
  ais-metadata-pgdata:
